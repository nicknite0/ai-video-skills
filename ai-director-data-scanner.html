<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Director Data Scanner V1</title>
<style>body{margin:0;background:#070b12;color:#e8f0ff;font-family:system-ui}main{max-width:1100px;margin:28px auto;padding:0 18px}h1,.step{color:#76b5ff}.panel{background:#0c1524;border:1px solid #24476d;border-radius:16px;padding:16px;margin:16px 0}button,label{background:#0d3159;color:white;border:1px solid #3479bd;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;margin:4px}button:disabled{opacity:.45}input{display:none}video{width:100%;max-height:480px;background:#000;border-radius:10px}.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}.frames img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.sub{color:#9fc8f7}.out{white-space:pre-wrap;background:#08111e;border:1px solid #203d5d;border-radius:10px;padding:14px;min-height:120px;font:13px/1.5 ui-monospace,monospace}progress{width:100%}</style></head><body><main>
<h1>AI Director Data Scanner V1</h1><div class="sub">Study a reference clip → sample the full timeline → AI reads representative frames → extract general directing observations → generate a test Director MD.</div>
<div class="panel"><b class="step">1. REFERENCE VIDEO</b><br><label>ADD VIDEO<input id="file" type="file" accept="video/*"></label><button id="scan" disabled>SCAN FULL CLIP</button><button id="ai" disabled>AI READ CLIP</button><div id="status" class="sub">Add one reference clip.</div><progress id="prog" value="0" max="1"></progress></div>
<div class="panel"><video id="video" controls></video></div><div id="frames" class="frames"></div>
<div class="panel"><b class="step">2. AI DATA</b><div id="data" class="out">No analysis yet.</div></div>
<div class="panel"><b class="step">3. TEST DIRECTOR MD</b><br><button id="md" disabled>MAKE TEST MD</button><button id="copy" disabled>COPY MD</button><div id="mdout" class="out">No MD yet.</div></div>
<canvas id="c" hidden></canvas>
<script>
const $=x=>document.getElementById(x);let file=null,frames=[],vision=null,observations=[];const c=$('c'),x=c.getContext('2d',{willReadFrequently:true});
function seek(v,t){return new Promise((r,j)=>{let z=setTimeout(()=>j(Error('seek timeout')),7000);v.onseeked=()=>{clearTimeout(z);r()};v.currentTime=t})}
$('file').onchange=e=>{file=e.target.files[0]||null;frames=[];observations=[];$('frames').innerHTML='';$('data').textContent='No analysis yet.';$('mdout').textContent='No MD yet.';$('scan').disabled=!file;$('ai').disabled=true;$('md').disabled=true;if(file){$('video').src=URL.createObjectURL(file);$('status').textContent=file.name+' loaded.'}};
$('scan').onclick=async()=>{let v=$('video');$('scan').disabled=true;$('status').textContent='Reading full timeline…';await new Promise((r,j)=>{if(v.readyState>=1)r();else{v.onloadedmetadata=r;v.onerror=j}});let d=v.duration,n=Math.min(24,Math.max(8,Math.ceil(d/5)));c.width=320;c.height=Math.max(180,Math.round(320*v.videoHeight/v.videoWidth));frames=[];let box=$('frames');box.innerHTML='';for(let i=0;i<n;i++){let t=n===1?0:(d-.05)*i/(n-1);await seek(v,t);x.drawImage(v,0,0,c.width,c.height);let src=c.toDataURL('image/jpeg',.76);frames.push({t,src});let im=new Image;im.src=src;im.title=t.toFixed(1)+'s';box.appendChild(im);$('prog').value=(i+1)/n}$('status').textContent='✓ Timeline sampled — '+n+' frames across '+d.toFixed(2)+'s.';$('ai').disabled=false;$('scan').disabled=false};
$('ai').onclick=async()=>{if(!frames.length)return;$('ai').disabled=true;try{$('status').textContent='Loading local AI vision model…';if(!vision){let m=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');vision=await m.pipeline('image-to-text','Xenova/vit-gpt2-image-captioning')}observations=[];for(let i=0;i<frames.length;i++){ $('status').textContent='AI reading frame '+(i+1)+' / '+frames.length+'…';let o=await vision(frames[i].src,{max_new_tokens:32});observations.push({t:frames[i].t,text:o?.[0]?.generated_text?.trim()||'unreadable frame'});$('prog').value=(i+1)/frames.length;await new Promise(r=>setTimeout(r,0))}let changes=[];for(let i=1;i<observations.length;i++){if(observations[i].text!==observations[i-1].text)changes.push(observations[i].t.toFixed(1)+'s: '+observations[i-1].text+' → '+observations[i].text)}$('data').textContent='VISUAL TIMELINE\n'+observations.map(o=>o.t.toFixed(1)+'s — '+o.text).join('\n')+'\n\nOBSERVED VISUAL CHANGES\n'+(changes.join('\n')||'No caption-level changes detected.')+'\n\nLIMITS\nThis V1 reads sampled visuals. It does not yet transcribe dialogue, identify a film, infer hidden intent, or claim exact camera/lens data.';$('status').textContent='✓ AI visual read complete.';$('md').disabled=false}catch(e){$('status').textContent='AI read failed: '+e.message}$('ai').disabled=false};
$('md').onclick=()=>{if(!observations.length)return;let unique=[...new Set(observations.map(o=>o.text))];let md='# DIRECTOR REFERENCE STUDY — TEST MD\n\n## STATUS\n🟡 NEW — TESTING\n\n## SOURCE-DERIVED VISUAL OBSERVATIONS\n'+unique.map(s=>'- '+s).join('\n')+'\n\n## CANDIDATE DIRECTING RULES\n- Establish important subjects and environment clearly before progressing to a new visual beat.\n- Preserve readable spatial relationships when attention shifts between subject and important object or location.\n- Give important reveals a clear setup, readable reveal, and time for the viewer to register the result.\n- Use shot changes to communicate a meaningful change in subject, information, action, or reaction rather than changing coverage without purpose.\n- Keep visual progression chronological and easy to follow.\n\n## TESTING NOTE\nThese are generalized candidate rules generated from sampled visual observations. Test them in WAN before promoting any rule to the main Director MD. Do not reproduce source-specific characters, dialogue, locations, or exact shot sequences.\n';$('mdout').textContent=md;$('copy').disabled=false};
$('copy').onclick=()=>navigator.clipboard.writeText($('mdout').textContent);
</script></main></body></html>
