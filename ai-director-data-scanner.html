<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Director Data Scanner V2</title>
<style>body{margin:0;background:#070b12;color:#e8f0ff;font-family:system-ui}main{max-width:1100px;margin:28px auto;padding:0 18px}h1,.step{color:#76b5ff}.panel{background:#0c1524;border:1px solid #24476d;border-radius:16px;padding:16px;margin:16px 0}button,label{background:#0d3159;color:white;border:1px solid #3479bd;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;margin:4px}button:disabled{opacity:.45}input{display:none}video{width:100%;max-height:480px;background:#000;border-radius:10px}.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}.frames img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.sub{color:#9fc8f7}.out{white-space:pre-wrap;background:#08111e;border:1px solid #203d5d;border-radius:10px;padding:14px;min-height:120px;font:13px/1.5 ui-monospace,monospace}progress{width:100%}</style></head><body><main>
<h1>AI Director Data Scanner V2</h1><div class="sub">Study directing behavior, not story content: timeline → visual AI → shot/change analysis → filmmaking patterns → source-derived Test Director MD.</div>
<div class="panel"><b class="step">1. REFERENCE VIDEO</b><br><label>ADD VIDEO<input id="file" type="file" accept="video/*"></label><button id="scan" disabled>SCAN FULL CLIP</button><button id="ai" disabled>AI READ CLIP</button><div id="status" class="sub">Add one reference clip.</div><progress id="prog" value="0" max="1"></progress></div>
<div class="panel"><video id="video" controls></video></div><div id="frames" class="frames"></div>
<div class="panel"><b class="step">2. DIRECTING DATA</b><div id="data" class="out">No analysis yet.</div></div>
<div class="panel"><b class="step">3. TEST DIRECTOR MD</b><br><button id="md" disabled>MAKE TEST MD</button><button id="copy" disabled>COPY MD</button><div id="mdout" class="out">No MD yet.</div></div>
<canvas id="c" hidden></canvas>
<script>
const $=x=>document.getElementById(x);let file=null,frames=[],vision=null,observations=[];const c=$('c'),x=c.getContext('2d',{willReadFrequently:true});
function seek(v,t){return new Promise((r,j)=>{let z=setTimeout(()=>j(Error('seek timeout')),7000);v.onseeked=()=>{clearTimeout(z);r()};v.currentTime=t})}
$('file').onchange=e=>{file=e.target.files[0]||null;frames=[];observations=[];$('frames').innerHTML='';$('data').textContent='No analysis yet.';$('mdout').textContent='No MD yet.';$('scan').disabled=!file;$('ai').disabled=true;$('md').disabled=true;if(file){$('video').src=URL.createObjectURL(file);$('status').textContent=file.name+' loaded.'}};
$('scan').onclick=async()=>{let v=$('video');$('scan').disabled=true;$('status').textContent='Reading full timeline…';await new Promise((r,j)=>{if(v.readyState>=1)r();else{v.onloadedmetadata=r;v.onerror=j}});let d=v.duration,n=Math.min(24,Math.max(8,Math.ceil(d/5)));c.width=320;c.height=Math.max(180,Math.round(320*v.videoHeight/v.videoWidth));frames=[];let box=$('frames');box.innerHTML='';for(let i=0;i<n;i++){let t=n===1?0:(d-.05)*i/(n-1);await seek(v,t);x.drawImage(v,0,0,c.width,c.height);let src=c.toDataURL('image/jpeg',.76);frames.push({t,src});let im=new Image;im.src=src;im.title=t.toFixed(1)+'s';box.appendChild(im);$('prog').value=(i+1)/n}$('status').textContent='✓ Timeline sampled — '+n+' frames across '+d.toFixed(2)+'s.';$('ai').disabled=false;$('scan').disabled=false};
$('ai').onclick=async()=>{if(!frames.length)return;$('ai').disabled=true;try{$('status').textContent='Loading local AI vision model…';if(!vision){let m=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');vision=await m.pipeline('image-to-text','Xenova/vit-gpt2-image-captioning')}observations=[];for(let i=0;i<frames.length;i++){ $('status').textContent='AI reading directing sample '+(i+1)+' / '+frames.length+'…';let o=await vision(frames[i].src,{max_new_tokens:32});observations.push({t:frames[i].t,text:o?.[0]?.generated_text?.trim()||'unreadable frame'});$('prog').value=(i+1)/frames.length;await new Promise(r=>setTimeout(r,0))}
let beats=[];for(let i=1;i<observations.length;i++){let a=observations[i-1],b=observations[i];if(a.text!==b.text)beats.push({t:b.t,from:a.text,to:b.text})}
let intervals=beats.length?beats.map((b,i)=>i?b.t-beats[i-1].t:b.t):[];
let avg=intervals.length?intervals.reduce((a,b)=>a+b,0)/intervals.length:0;
let patterns=[];
const all=observations.map(o=>o.text.toLowerCase());
if(all.some(t=>/two|people|man and woman|group/.test(t)))patterns.push('MULTI-SUBJECT COVERAGE: recurring frames contain two or more people; study how attention shifts between subjects.');
if(all.some(t=>/holding|looking|phone|cup|remote|laptop|object|baby/.test(t)))patterns.push('SUBJECT–OBJECT EMPHASIS: recurring frames move attention between people and handled/looked-at objects.');
if(beats.length>Math.max(3,observations.length*.55))patterns.push('FREQUENT VISUAL CHANGE: sampled composition/content changes often across the timeline; candidate for active coverage or frequent shot changes.');
else patterns.push('LONGER VISUAL HOLDS: sampled composition/content changes less frequently; candidate for restrained coverage.');
if(all.some(t=>/standing/.test(t))&&all.some(t=>/sitting|laying/.test(t)))patterns.push('BLOCKING VARIATION: subjects appear in different body positions/staging states across the sequence.');
if(all.some(t=>/room|building|doorway/.test(t)))patterns.push('LOCATION CONTEXT: environment is repeatedly readable around subjects rather than disappearing from coverage.');
$('data').textContent='DIRECTING STUDY — VISUAL EVIDENCE\n\nSAMPLED TIMELINE\n'+observations.map(o=>o.t.toFixed(1)+'s — '+o.text).join('\n')+'\n\nVISUAL BEAT CHANGES\n'+(beats.map(b=>b.t.toFixed(1)+'s — visual emphasis/composition changed').join('\n')||'No caption-level changes detected.')+'\n\nDERIVED FILMMAKING PATTERNS\n- '+patterns.join('\n- ')+'\n\nCHANGE RHYTHM\n'+beats.length+' sampled visual changes across '+frames[frames.length-1].t.toFixed(1)+'s'+(avg?' • mean sampled change interval ~'+avg.toFixed(1)+'s':'')+'.\n\nLIMITS\nV2 derives directing clues from sampled visual evidence. Caption changes are not guaranteed to equal true cuts. Camera motion, lens, dialogue, audio, and exact shot boundaries are not yet directly measured.';
window.directorPatterns=patterns;$('status').textContent='✓ V2 directing study complete.';$('md').disabled=false}catch(e){$('status').textContent='AI read failed: '+e.message}$('ai').disabled=false};
$('md').onclick=()=>{if(!observations.length)return;let p=window.directorPatterns||[];let rules=[];p.forEach(s=>{if(s.startsWith('MULTI-SUBJECT'))rules.push('- When multiple subjects share a scene, keep their relationship readable and make attention shifts purposeful.');if(s.startsWith('SUBJECT–OBJECT'))rules.push('- When an object becomes important, establish the subject/object relationship before shifting emphasis, then preserve the object clearly through the beat.');if(s.startsWith('FREQUENT'))rules.push('- For visually active sequences, allow purposeful coverage changes when subject, information, action, or reaction changes; avoid arbitrary changes.');if(s.startsWith('LONGER'))rules.push('- When the visual beat remains stable, hold useful compositions instead of forcing unnecessary coverage changes.');if(s.startsWith('BLOCKING'))rules.push('- Let blocking evolve through readable staging changes while preserving where subjects are relative to each other and the environment.');if(s.startsWith('LOCATION'))rules.push('- Re-establish enough environmental context during coverage so scene geography remains readable.');});let md='# DIRECTOR REFERENCE STUDY V2 — TEST MD\n\n## STATUS\n🟡 NEW — TESTING\n\n## SOURCE-DERIVED FILMMAKING PATTERNS\n'+p.map(s=>'- '+s).join('\n')+'\n\n## 🟡 CANDIDATE DIRECTING RULES — TESTING\n'+(rules.join('\n')||'- No strong candidate rule extracted from this scan.')+'\n\n## SOURCE SEPARATION\nThese rules are generalized from detected filmmaking patterns, not source-specific characters, dialogue, locations, props, or exact shot sequences.\n\n## VALIDATION\nTest each candidate in WAN before moving it into the main Director MD. One reference clip is evidence for a test, not proof of a universal directing rule.\n';$('mdout').textContent=md;$('copy').disabled=false};
$('copy').onclick=()=>navigator.clipboard.writeText($('mdout').textContent);
</script></main></body></html>
