<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI-Assisted VFX Lab V1</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b12;color:#e8f0ff;font:14px system-ui,Segoe UI,Arial}.wrap{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 6px;color:#7db7ff}.sub{color:#93a4bd;margin-bottom:20px}.panel{background:#0d1420;border:1px solid #1d3557;border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.file{border:1px solid #2864a8;background:#102a49;color:#eaf4ff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.file input{display:none}video{width:100%;max-height:420px;background:#000;border-radius:10px;margin-top:12px}progress{width:100%;height:16px}pre{white-space:pre-wrap;background:#05080d;border:1px solid #17283d;border-radius:10px;padding:14px;min-height:160px;max-height:420px;overflow:auto}.stat{background:#101d2d;border-radius:9px;padding:9px 12px}.vfxbox{margin-top:12px;padding:14px;background:#09111d;border:1px solid #1d3557;border-radius:10px}.vfxbox textarea{width:100%;min-height:72px;resize:vertical;background:#05080d;color:#e8f0ff;border:1px solid #2864a8;border-radius:8px;padding:10px;font:14px system-ui}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#101d2d;color:#9fc8ff;margin:3px}canvas{display:none}
</style></head>
<body><div class="wrap">
<h1>AI-Assisted VFX Lab V1</h1>
<div class="sub">Experimental local video scan + AI-assisted VFX workspace. Video Director Analyzer V1 remains untouched.</div>
<div class="panel">
<div class="row"><label class="file">Choose MP4<input id="file" type="file" accept="video/*"></label><button id="scan" disabled>SCAN VIDEO</button><button id="vfx" disabled>AI-ASSISTED VFX</button><button id="save" disabled>SAVE VIDEO</button><button id="copy" disabled>COPY SCAN REPORT</button></div>
<video id="video" controls></video>
<div id="vfxbox" class="vfxbox" hidden><b>VFX INSTRUCTION</b><div class="sub" style="margin:5px 0 8px">Describe what should be changed. V1 records the instruction; semantic tracking/removal is not faked.</div><textarea id="instruction" placeholder="Example: Remove the man on the right."></textarea><div class="row" style="margin-top:9px"><button id="queue">PREPARE VFX TASK</button></div><div id="task" class="sub" style="margin:9px 0 0"></div></div>
</div>
<div class="panel"><progress id="prog" value="0" max="1"></progress><div id="status" class="sub">Load a video to begin.</div><div id="stats" class="row"></div></div>
<div class="panel"><pre id="report">No scan yet.</pre></div>
<canvas id="c"></canvas>
</div>
<script>
const $=id=>document.getElementById(id),v=$('video'),c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true});
let file,report='',sourceUrl='';
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(file);v.src=sourceUrl;$('scan').disabled=false;$('vfx').disabled=true;$('save').disabled=false;$('copy').disabled=true;$('status').textContent='Ready: '+file.name};
const seek=t=>new Promise(r=>{const f=()=>{v.removeEventListener('seeked',f);r()};v.addEventListener('seeked',f);v.currentTime=Math.min(t,Math.max(0,v.duration-.001))});
function snap(){const w=160,h=Math.max(90,Math.round(160*v.videoHeight/v.videoWidth));c.width=w;c.height=h;ctx.drawImage(v,0,0,w,h);let d=ctx.getImageData(0,0,w,h).data,a=new Float32Array(w*h),sum=0;for(let i=0,j=0;i<d.length;i+=4,j++){let y=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];a[j]=y;sum+=y}return{a,mean:sum/a.length}}
function diff(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length}
function fmt(t){let m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(3).padStart(6,'0')}
$('scan').onclick=async()=>{if(!file)return;$('scan').disabled=true;await new Promise(r=>v.readyState>=1?r():v.addEventListener('loadedmetadata',r,{once:true}));const dur=v.duration,fps=30,total=Math.max(1,Math.floor(dur*fps)),events=[],means=[];let prev=null,freezeRun=0,freezeStart=0;$('status').textContent='Scanning every frame…';for(let i=0;i<total;i++){let t=i/fps;await seek(t);let s=snap();means.push(s.mean);if(prev){let d=diff(prev,s.a);if(d>34)events.push({t,type:'ABRUPT VISUAL CHANGE',d});if(d<.35){if(!freezeRun)freezeStart=t-1/fps;freezeRun++}else{if(freezeRun>=Math.round(fps*.5))events.push({t:freezeStart,type:'POSSIBLE FREEZE',len:freezeRun/fps});freezeRun=0}}prev=s.a;$('prog').value=(i+1)/total;if(i%10===0)$('status').textContent='Scanning frame '+(i+1)+' / '+total+'…'}if(freezeRun>=Math.round(fps*.5))events.push({t:freezeStart,type:'POSSIBLE FREEZE',len:freezeRun/fps});let dark=means.filter(x=>x<12).length,cuts=events.filter(x=>x.type==='ABRUPT VISUAL CHANGE'),avg=means.reduce((a,b)=>a+b,0)/means.length;report='AI-ASSISTED VFX LAB V1 — TECHNICAL SCAN\nFile: '+file.name+'\nDuration: '+dur.toFixed(2)+'s\nFrames scanned: '+total+' @ '+fps+' fps\n\nAbrupt visual changes: '+cuts.length+'\nDark/fade frames: '+dark+'\nAverage brightness: '+avg.toFixed(1)+'/255\n\nTIMELINE\n'+(events.length?events.map(x=>fmt(x.t)+' — '+x.type+(x.d?' (difference '+x.d.toFixed(1)+')':'')+(x.len?' ('+x.len.toFixed(2)+'s)':'')).join('\n'):'No major technical events detected.')+'\n\nV1 STATUS\nTechnical scan is active. Semantic person/object understanding, tracking, masks, removal and generative reconstruction are experimental stages and are not claimed by this scan.';$('report').textContent=report;$('stats').innerHTML='<div class="stat">Frames: '+total+'</div><div class="stat">Abrupt changes: '+cuts.length+'</div><div class="stat">Dark frames: '+dark+'</div><span class="tag">VFX Lab Ready</span>';$('status').textContent='Scan complete. Ready for a VFX instruction.';$('copy').disabled=false;$('vfx').disabled=false;$('scan').disabled=false};
$('vfx').onclick=()=>{$('vfxbox').hidden=!$('vfxbox').hidden;if(!$('vfxbox').hidden)$('instruction').focus()};
$('queue').onclick=()=>{let x=$('instruction').value.trim();$('task').textContent=x?'Prepared VFX task: “'+x+'” — no destructive processing has been applied.':'Enter a VFX instruction first.'};
$('copy').onclick=()=>navigator.clipboard.writeText(report);
$('save').onclick=()=>{if(!file)return;const a=document.createElement('a');a.href=sourceUrl;a.download=file.name.replace(/\.mp4$/i,'')+'_vfx-lab-source.mp4';a.click()};
</script></body></html>
