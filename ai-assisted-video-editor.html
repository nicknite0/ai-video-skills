<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Assisted Video Editor V1</title>
<style>
body{margin:0;background:#070b12;color:#e8f0ff;font-family:system-ui}main{max-width:1120px;margin:28px auto;padding:0 18px}h1{color:#76b5ff}.sub{color:#9fc8f7}.panel{background:#0c1524;border:1px solid #24476d;border-radius:16px;padding:16px;margin:16px 0}button,label.pick{background:#0d3159;color:white;border:1px solid #3479bd;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;margin:4px}input{display:none}.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#08111e;border:1px solid #203d5d;border-radius:12px;padding:10px}video{width:100%;border-radius:8px;background:black}.name{font-weight:800;margin:7px 0}.stats{font:13px monospace;white-space:pre-wrap;color:#c9e1ff}progress{width:100%}pre{white-space:pre-wrap;background:#05080d;border:1px solid #1c3653;border-radius:10px;padding:14px;min-height:100px}canvas{display:none}
</style></head><body><main>
<h1>AI-Assisted Video Editor V1</h1>
<div class="sub">Multi-clip local scanner. V1 analyzes clips only — no editing or rendering yet.</div>
<div class="panel"><label class="pick">ADD CLIPS<input id="files" type="file" accept="video/mp4" multiple></label><button id="scan" disabled>SCAN ALL CLIPS</button><button id="clear">CLEAR</button>
<div class="sub" style="margin-top:8px">V1 limit: up to <b>20 MP4 clips</b> per batch. Files stay in your browser.</div></div>
<div class="panel"><progress id="progress" value="0" max="1"></progress><div id="status" class="sub">Add clips to begin.</div></div>
<div id="clips" class="clips"></div>
<div class="panel"><b>PROJECT SCAN REPORT</b><pre id="report">No clips scanned yet.</pre></div>
<canvas id="c"></canvas>
<script>
const $=x=>document.getElementById(x),c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true});let files=[],results=[];
$('files').onchange=e=>{files=[...e.target.files].slice(0,20);results=[];render();$('scan').disabled=!files.length;$('status').textContent=files.length+' clip(s) loaded.'};
$('clear').onclick=()=>{files=[];results=[];$('files').value='';render();$('scan').disabled=true;$('report').textContent='No clips scanned yet.';$('status').textContent='Add clips to begin.';$('progress').value=0};
function render(){let root=$('clips');root.innerHTML='';files.forEach((f,i)=>{let d=document.createElement('div');d.className='card';let v=document.createElement('video');v.controls=true;v.src=URL.createObjectURL(f);d.innerHTML='<div class="name">Clip '+(i+1)+' — '+f.name+'</div>';d.appendChild(v);let s=document.createElement('div');s.className='stats';s.textContent=results[i]?fmtResult(results[i]):'Waiting for scan';d.appendChild(s);root.appendChild(d)})}
function fmtResult(r){return 'Duration: '+r.duration.toFixed(2)+'s\nFrames sampled: '+r.frames+'\nAbrupt changes: '+r.abrupt+'\nDark samples: '+r.dark+'\nAverage brightness: '+r.brightness.toFixed(1)+'/255'}
function seek(v,t){return new Promise(res=>{let done=()=>{v.removeEventListener('seeked',done);res()};v.addEventListener('seeked',done);v.currentTime=t})}
async function scanFile(f,index){let v=document.createElement('video'),url=URL.createObjectURL(f);v.src=url;v.muted=true;await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej});let dur=v.duration,w=160,h=Math.max(90,Math.round(w*(v.videoHeight/v.videoWidth)));c.width=w;c.height=h;let fps=10,total=Math.max(2,Math.floor(dur*fps)),prev=null,abrupt=0,dark=0,sumB=0;for(let n=0;n<total;n++){let t=Math.min(dur-.03,n/fps);await seek(v,t);ctx.drawImage(v,0,0,w,h);let d=ctx.getImageData(0,0,w,h).data,gray=new Uint8Array(w*h),b=0;for(let p=0,j=0;p<d.length;p+=4,j++){let g=(d[p]*.299+d[p+1]*.587+d[p+2]*.114)|0;gray[j]=g;b+=g}b/=gray.length;sumB+=b;if(b<12)dark++;if(prev){let diff=0;for(let j=0;j<gray.length;j++)diff+=Math.abs(gray[j]-prev[j]);diff/=gray.length;if(diff>34)abrupt++}prev=gray;$('progress').value=(index+n/total)/files.length}URL.revokeObjectURL(url);return{duration:dur,frames:total,abrupt,dark,brightness:sumB/total}}
$('scan').onclick=async()=>{$('scan').disabled=true;results=[];$('progress').value=0;for(let i=0;i<files.length;i++){$('status').textContent='Scanning clip '+(i+1)+' of '+files.length+': '+files[i].name;results[i]=await scanFile(files[i],i);render()}$('progress').value=1;$('status').textContent='Scan complete — '+files.length+' clips analyzed.';let total=results.reduce((a,r)=>a+r.duration,0);$('report').textContent='AI-ASSISTED VIDEO EDITOR V1 — PROJECT SCAN\nClips: '+files.length+'\nTotal source duration: '+total.toFixed(2)+'s\n\n'+results.map((r,i)=>'CLIP '+(i+1)+' — '+files[i].name+'\n'+fmtResult(r)).join('\n\n');$('scan').disabled=false};
</script></main></body></html>
